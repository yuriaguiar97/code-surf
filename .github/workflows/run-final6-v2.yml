name: Run final6 UI patch

on:
  push:
    paths:
      - '.github/workflows/run-final6-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/polish_final6.py
      - name: Validate
        run: |
          node --check app.js
          grep -q 'FINAL · 2026.10.04 · 6' app.html
          grep -q 'class="nav-register"' app.html
          grep -q 'Você receberá um alerta quando as condições estiverem favoráveis' app.html
          ! grep -q 'monitorar aproximação do CODE' app.js
          ! grep -q 'id="spotStars"' app.html
      - name: Commit changes
        run: |
          git config user.name 'CODE deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html app.js styles.css
          git commit -m 'Refine spot overview alerts and session navigation'
          git push
