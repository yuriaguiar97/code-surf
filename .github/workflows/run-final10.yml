name: Run final10 CODE access polish
on:
  push:
    paths:
      - '.github/workflows/run-final10.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final10 patch
        run: python .github/scripts/final10_patch.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify access flow
        run: |
          grep -q "ACCESS_PIN='7777'" app.js
          grep -q 'registeredBy:currentUserName()' app.js
          grep -q 'id="pinGate"' app.html
          grep -q 'id="typedTag"' app.html
          grep -q 'FINAL · 2026.10.04 · 10' app.html
          grep -q '20261004final10' index.html
      - name: Commit changes
        run: |
          git config user.name 'CODE deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html styles.css app.js index.html
          git commit -m 'Add PIN gate and named session identity'
          git push
