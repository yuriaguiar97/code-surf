name: Patch map picker

on:
  push:
    paths:
      - '.github/workflows/patch-map-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add searchable map picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          if 'leaflet@1.9.4/dist/leaflet.css' not in s:
              s=s.replace('<title>CODE · Ubatuba</title>', '<title>CODE · Ubatuba</title>\n<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">')
          css='.location-summary{margin:9px 0 4px;padding:11px 12px;border:1px solid #17303b;border-radius:11px;background:#08151c;color:#91a9b4;font-size:12px}.location-summary.marked{color:#dcebf0;border-color:#245165}.map-modal{z-index:40;align-items:center;padding:14px}.map-sheet{border-radius:20px;max-height:92dvh;overflow:auto}.map-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.map-search .field{margin:0}.map-search .mini{padding:0 15px;font-weight:800}.map-results{display:grid;gap:6px;margin:8px 0;max-height:150px;overflow:auto}.map-result{width:100%;text-align:left;padding:10px 11px;border:1px solid #17303b;border-radius:10px;background:#091820;color:#d9e7ec;font-size:11px;line-height:1.35}.map-canvas{height:360px;border-radius:14px;border:1px solid #17303b;overflow:hidden;background:#0a1820;margin-top:10px}.map-coords{font:10px "Courier New",monospace;color:#7f98a4;margin:9px 1px 0;line-height:1.4}.leaflet-container{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.leaflet-control-attribution{font-size:8px!important}'
          if '.map-canvas{' not in s:
              s=s.replace('</style>', css+'\n</style>')
          old='<div class="section-label">LOCALIZAÇÃO · OPCIONAL, RECOMENDADA</div><div class="form-grid"><input id="spotLat" class="field" inputmode="decimal" placeholder="Latitude · -23.0000"><input id="spotLon" class="field" inputmode="decimal" placeholder="Longitude · -45.0000"></div><button id="useLocation" class="btn secondary" type="button">USAR MINHA LOCALIZAÇÃO AGORA</button><div class="hintbox">A localização dá ao CODE um ponto físico para relacionar exposição e previsão. Sozinha, ela não revela com precisão o melhor swell do pico.</div>'
          new='<div class="section-label">LOCALIZAÇÃO · OPCIONAL, RECOMENDADA</div><button id="openMapPicker" class="btn secondary" type="button">⌖ BUSCAR E MARCAR NO MAPA</button><div id="spotLocationSummary" class="location-summary">Nenhum local marcado</div><input id="spotLat" type="hidden"><input id="spotLon" type="hidden"><div class="hintbox">Busque uma praia ou referência e depois toque exatamente no ponto do mapa onde fica o pico. O CODE salva as coordenadas automaticamente.</div>'
          if old not in s:
              raise SystemExit('location block not found')
          s=s.replace(old,new,1)
          modal='\n<div id="mapModal" class="modal map-modal"><div class="sheet map-sheet"><h2>Marcar localização do pico</h2><div class="sub">Pesquise a região e toque no mapa para posicionar o pico com precisão.</div><div class="map-search"><input id="mapSearch" class="field" placeholder="Buscar praia, rua ou lugar · ex. Itamambuca, Ubatuba"><button id="mapSearchBtn" class="mini" type="button">BUSCAR</button></div><div id="mapResults" class="map-results"></div><div id="mapCanvas" class="map-canvas"></div><div id="mapCoords" class="map-coords">Busque um lugar ou toque no mapa para marcar o pico.</div><div class="sheet-actions"><button id="cancelMap" class="btn secondary" type="button">CANCELAR</button><button id="confirmMap" class="btn" type="button">USAR ESTE PONTO</button></div></div></div>\n<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>\n'
          if 'id="mapModal"' not in s:
              s=s.replace('\n<script>\n(()=>{', modal+'\n<script>\n(()=>{',1)
          decl="const LAT=-23.4347,LON=-45.0711,MAR_LAT=-23.5,MAR_LON=-44.25,$=id=>document.getElementById(id);let latest={},forecastData=null,selectedDay='';let editingId=null;let currentSpotId=localStorage.getItem('code_current_spot')||'';"
          decl_new="const LAT=-23.4347,LON=-45.0711,MAR_LAT=-23.5,MAR_LON=-44.25,$=id=>document.getElementById(id);let latest={},forecastData=null,selectedDay='';let editingId=null,mapPicker=null,mapMarker=null,pendingMapPoint=null;let currentSpotId=localStorage.getItem('code_current_spot')||'';"
          if decl not in s:
              raise SystemExit('declaration not found')
          s=s.replace(decl,decl_new,1)
          oldvals="$('spotLat').value=x?.lat??'';$('spotLon').value=x?.lon??'';"
          if oldvals not in s:
              raise SystemExit('editor lat/lon assignment not found')
          s=s.replace(oldvals,oldvals+'updateLocationSummary();',1)
          oldgeo="$('useLocation').onclick=()=>{if(!navigator.geolocation)return alert('Geolocalização não disponível neste aparelho.');$('useLocation').textContent='LOCALIZANDO…';navigator.geolocation.getCurrentPosition(p=>{$('spotLat').value=p.coords.latitude.toFixed(6);$('spotLon').value=p.coords.longitude.toFixed(6);$('useLocation').textContent='LOCALIZAÇÃO PREENCHIDA'},()=>{$('useLocation').textContent='USAR MINHA LOCALIZAÇÃO AGORA';alert('Não consegui acessar sua localização. Você pode preencher as coordenadas manualmente.')},{enableHighAccuracy:true,timeout:10000})};"
          mapjs="""function updateLocationSummary(){const lat=Number($('spotLat').value),lon=Number($('spotLon').value),ok=Number.isFinite(lat)&&Number.isFinite(lon)&&$('spotLat').value!==''&&$('spotLon').value!=='';const el=$('spotLocationSummary');if(!el)return;el.classList.toggle('marked',ok);el.textContent=ok?'📍 '+lat.toFixed(5)+', '+lon.toFixed(5)+' · ponto marcado':'Nenhum local marcado'}
          function setMapPoint(lat,lon,label='Ponto marcado'){lat=Number(lat);lon=Number(lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;pendingMapPoint={lat,lon};if(mapPicker){if(!mapMarker)mapMarker=L.marker([lat,lon]).addTo(mapPicker);else mapMarker.setLatLng([lat,lon]);mapPicker.panTo([lat,lon])}$('mapCoords').textContent=label+' · '+lat.toFixed(6)+', '+lon.toFixed(6)}
          function openMapPicker(){const lat=Number($('spotLat').value),lon=Number($('spotLon').value),has=$('spotLat').value!==''&&$('spotLon').value!==''&&Number.isFinite(lat)&&Number.isFinite(lon);pendingMapPoint=has?{lat,lon}:null;$('mapResults').innerHTML='';$('mapSearch').value='';$('mapModal').classList.add('show');setTimeout(()=>{if(!window.L){alert('O mapa não conseguiu carregar. Tente novamente em alguns segundos.');return}if(!mapPicker){mapPicker=L.map('mapCanvas',{zoomControl:true}).setView(has?[lat,lon]:[LAT,LON],has?16:11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(mapPicker);mapPicker.on('click',e=>setMapPoint(e.latlng.lat,e.latlng.lng,'Ponto marcado'))}else{mapPicker.invalidateSize();mapPicker.setView(has?[lat,lon]:[LAT,LON],has?16:11)}if(has)setMapPoint(lat,lon,'Ponto atual');else{if(mapMarker){mapPicker.removeLayer(mapMarker);mapMarker=null}$('mapCoords').textContent='Busque um lugar ou toque no mapa para marcar o pico.'}},120)}
          function closeMapPicker(){$('mapModal').classList.remove('show')}
          async function searchMap(){const q=$('mapSearch').value.trim();if(!q)return;$('mapSearchBtn').textContent='...';$('mapResults').innerHTML='<div class=\"hintbox\">Buscando…</div>';try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=pt-BR&countrycodes=br&q='+encodeURIComponent(q);const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('search');const data=await r.json();if(!data.length){$('mapResults').innerHTML='<div class=\"hintbox\">Nenhum resultado. Tente incluir Ubatuba ou o nome da praia.</div>';return}$('mapResults').innerHTML=data.map((x,i)=>'<button class=\"map-result\" type=\"button\" data-result=\"'+i+'\">'+esc(x.display_name)+'</button>').join('');$('mapResults').querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{const x=data[Number(b.dataset.result)],lat=Number(x.lat),lon=Number(x.lon);setMapPoint(lat,lon,x.display_name.split(',').slice(0,2).join(','));mapPicker.setView([lat,lon],16);$('mapResults').innerHTML=''})}catch(e){console.error(e);$('mapResults').innerHTML='<div class=\"hintbox\">Não consegui buscar agora. Você ainda pode navegar e tocar diretamente no mapa.</div>'}finally{$('mapSearchBtn').textContent='BUSCAR'}}
          $('openMapPicker').onclick=openMapPicker;$('cancelMap').onclick=closeMapPicker;$('confirmMap').onclick=()=>{if(!pendingMapPoint)return alert('Marque um ponto no mapa primeiro.');$('spotLat').value=pendingMapPoint.lat.toFixed(6);$('spotLon').value=pendingMapPoint.lon.toFixed(6);updateLocationSummary();closeMapPicker()};$('mapSearchBtn').onclick=searchMap;$('mapSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchMap()}};$('mapModal').onclick=e=>{if(e.target===$('mapModal'))closeMapPicker()};"""
          mapjs='\n'.join(line.lstrip() for line in mapjs.splitlines())
          if oldgeo not in s:
              raise SystemExit('old geolocation handler not found')
          s=s.replace(oldgeo,mapjs,1)
          s=s.replace('BUILD 2026.10.04-D','BUILD 2026.10.04-E')
          p.write_text(s)
          idx=Path('index.html')
          idx.write_text(idx.read_text().replace('20261004d','20261004e'))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          if not scripts: raise SystemExit('inline script missing')
          Path('/tmp/app-inline.js').write_text(scripts[-1])
          assert 'id="mapCanvas"' in s and 'BUSCAR E MARCAR NO MAPA' in s and 'BUILD 2026.10.04-E' in s
          PY
          node --check /tmp/app-inline.js
          git config user.name "CODE deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html index.html
          git rm .github/workflows/patch-map-picker.yml
          git commit -m "Replace spot geolocation with searchable map picker"
          git push
