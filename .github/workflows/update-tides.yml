name: Refresh Ubatuba tide table
on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-tide-table
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate the next tide days
        run: python3 tools/update_tides.py
      - name: Publish the updated snapshot
        run: |
          git config user.name "CODE tide updater"
          git config user.email "actions@users.noreply.github.com"
          git add tides.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Ubatuba harmonic tide table"
          git pull --rebase origin main
          git push origin HEAD:main
