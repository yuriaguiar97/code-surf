name: Marine model check

on:
  push:
    paths:
      - '.github/workflows/debug-marine.yml'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CODE data sources
        shell: bash
        run: |
          set -e
          curl -fsSL "https://marine-api.open-meteo.com/v1/marine?latitude=-23.5&longitude=-44.25&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,secondary_swell_wave_height,secondary_swell_wave_direction,secondary_swell_wave_period,tertiary_swell_wave_height,tertiary_swell_wave_direction,tertiary_swell_wave_period&models=ncep_gfswave025&timezone=America%2FSao_Paulo&forecast_days=1&cell_selection=sea" > /tmp/wave.json
          python3 -c "import json; h=json.load(open('/tmp/wave.json'))['hourly']; print('WAVES'); [(lambda i: print(t,h['wave_height'][i],h['wave_period'][i],h['wave_direction'][i]))(i) for i,t in enumerate(h['time']) if t[11:13] in {'08','10','12','14','16','18','20','22'}]"
          curl -fsSL "https://marine-api.open-meteo.com/v1/marine?latitude=-23.4347&longitude=-45.0711&hourly=sea_level_height_msl&models=meteofrance_currents&timezone=America%2FSao_Paulo&forecast_days=1&cell_selection=sea" > /tmp/tide.json
          python3 -c "import json; j=json.load(open('/tmp/tide.json')); h=j['hourly']; v=h['sea_level_height_msl']; print('TIDE',len(v),min(v),max(v)); [print('EXT',h['time'][i],v[i]) for i in range(1,len(v)-1) if (v[i]>v[i-1] and v[i]>=v[i+1]) or (v[i]<v[i-1] and v[i]<=v[i+1])]"
