name: Run final9 CODE polish
on:
  push:
    paths:
      - '.github/workflows/run-final9.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final9 patch
        run: python .github/scripts/final9_patch.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify requested UI changes
        run: |
          grep -q 'spotPhotoInput' app.html
          grep -q 'codeConfValue' app.html
          grep -q 'compressSpotPhoto' app.js
          ! grep -q 'backend de notificações push' app.html
          grep -q 'FINAL · 2026.10.04 · 9' app.html
      - name: Commit changes
        run: |
          git config user.name 'CODE deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html styles.css app.js
          git commit -m 'Add editable spot photos and CODE confidence percentage'
          git push
