name: Run final6 UI polish

on:
  push:
    paths:
      - '.github/workflows/run-final6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 -c "import base64; exec(base64.b64decode(' y5pZF0hPT1mYWxzZT8nY2hlY2tlZCc6Jyd9PjxzcGFuIGNsYXNzPVxcInNsaWRlclxcIj48L3NwYW4+PC9sYWJlbD48L2Rpdj5gKS5qb2luKCcnKTo nPHNtYWxsPk5lbmh1bSBwaWNvIGNhZGFzdHJhZG8uPC9zbWFsbD4nOyIK"))"
      - name: Validate
        run: |
          node --check app.js
          grep -q 'FINAL · 2026.10.04 · 6' app.html
          grep -q 'nav-register' app.html
          grep -q 'Você receberá um alerta quando as condições estiverem favoráveis' app.html
      - name: Commit
        run: |
          git config user.name 'CODE deploy bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html app.js styles.css
          git commit -m 'Refine spot overview, alerts and persistent session action'
          git push
