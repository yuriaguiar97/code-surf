name: Patch CODE build H

on:
  push:
    paths:
      - '.github/workflows/patch-build-h.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply build H
        shell: bash
        run: |
          python3 .github/patch_build_h.py
          grep -q "BUILD 2026.10.04-H" app.html
          grep -q "function conditionTone" app.html
          grep -q "tides.json" app.html
          grep -q "20261004h" index.html
          rm .github/workflows/patch-build-h.yml .github/patch_build_h.py
          git config user.name "CODE deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html index.html .github/workflows/patch-build-h.yml .github/patch_build_h.py
          git commit -m "Fix tide source and add red green surf signals"
          git push
