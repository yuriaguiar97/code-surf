name: Patch daily forecast UI

on:
  push:
    paths:
      - '.github/workflows/patch-daily-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Windguru-style interval and heat colors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.html')
          s=p.read_text()
          s=s.replace('Variação de 00h até 24h','Intervalos de 2h · padrão Windguru')
          s=s.replace('Leitura em intervalos de 2 horas, no estilo de uma grade diária: ondulação, direção, período, vento, rajadas, direção do vento, energia e maré.','Leitura em intervalos de 2 horas, alinhada ao padrão visual do Windguru. Quanto mais escura a célula, maior a intensidade.')
          helper="function heatColor(kind,val){const n=Number(val);if(!Number.isFinite(n))return '';const cfg={wave:[.5,2.5,214],period:[7,16,334],wind:[0,20,186]}[kind];if(!cfg)return '';const [lo,hi,h]=cfg,t=Math.max(0,Math.min(1,(n-lo)/(hi-lo))),sat=Math.round(48+30*t),light=Math.round(31-14*t);return `hsl(${h} ${sat}% ${light}%)`}function heatStyle(kind,val){const bg=heatColor(kind,val);return bg?`background:${bg};color:#f5fbfd;font-weight:800`:''}function tintSnap(id,kind,val){const el=$(id)?.closest('.snap'),bg=heatColor(kind,val);if(el&&bg)el.style.background=bg}"
          if 'function heatColor(' not in s: s=s.replace('function renderDayMatrix(day){',helper+'function renderDayMatrix(day){',1)
          s=s.replace(".filter(([v])=>v.startsWith(day)&&Number(v.slice(11,13))%2===0)",".filter(([v])=>{const h=Number(v.slice(11,13));return v.startsWith(day)&&h>=3&&h<=23&&h%2===1})",1)
          old="const mk=(cls,label,icon,fn)=>`<tr class=\"${cls}\"><td><span class=\"rowicon\">${icon}</span>${label}</td>${idx.map(([ts,i])=>`<td>${fn(ts,i)}</td>`).join('')}</tr>`;"
          new="const mk=(cls,label,icon,fn,styleFn)=>`<tr class=\"${cls}\"><td><span class=\"rowicon\">${icon}</span>${label}</td>${idx.map(([ts,i])=>{const st=styleFn?styleFn(ts,i):'';return `<td${st?` style=\"${st}\"`:''}>${fn(ts,i)}</td>`}).join('')}</tr>`;"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("html+=mk('wave-row','Ondulação','≈',(ts,i)=>f(m.hourly.wave_height[i])+' m');","html+=mk('wave-row','Ondulação','≈',(ts,i)=>f(m.hourly.wave_height[i])+' m',(ts,i)=>heatStyle('wave',m.hourly.wave_height[i]));",1)
          s=s.replace("html+=mk('period-row','Período','◷',(ts,i)=>f(dominantPeriod(m.hourly,i),0)+' s');","html+=mk('period-row','Período','◷',(ts,i)=>f(dominantPeriod(m.hourly,i),0)+' s',(ts,i)=>heatStyle('period',dominantPeriod(m.hourly,i)));",1)
          s=s.replace("html+=mk('','Vento','≋',(ts,i)=>{const wi=windIndex(ts);return f(w.hourly.wind_speed_10m[wi],0)+' kt'});","html+=mk('','Vento','≋',(ts,i)=>{const wi=windIndex(ts);return f(w.hourly.wind_speed_10m[wi],0)+' kt'},(ts,i)=>{const wi=windIndex(ts);return heatStyle('wind',w.hourly.wind_speed_10m[wi])});",1)
          s=s.replace("html+=mk('','Rajada','»',(ts,i)=>{const wi=windIndex(ts);return f(w.hourly.wind_gusts_10m[wi],0)+' kt'});","html+=mk('','Rajada','»',(ts,i)=>{const wi=windIndex(ts);return f(w.hourly.wind_gusts_10m[wi],0)+' kt'},(ts,i)=>{const wi=windIndex(ts);return heatStyle('wind',w.hourly.wind_gusts_10m[wi])});",1)
          target="$('energy').textContent=f(e,0);$('tideNow').textContent=Number.isFinite(Number(tv))?f(tv,2)+' m':'—';$('dailyDate').textContent=dayName(day,true)"
          if target in s: s=s.replace(target,target+";tintSnap('wave','wave',H);tintSnap('period','period',p);tintSnap('wind','wind',wv);tintSnap('gust','wind',g)",1)
          s=s.replace('BUILD 2026.10.04-E','BUILD 2026.10.04-F')
          p.write_text(s)
          idx=Path('index.html')
          idx.write_text(idx.read_text().replace('20261004e','20261004f'))
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/app-inline.js').write_text(scripts[-1])
          assert 'h>=3&&h<=23&&h%2===1' in s
          assert "heatStyle('wave'" in s and "heatStyle('period'" in s and "heatStyle('wind'" in s
          assert 'BUILD 2026.10.04-F' in s
          PY
          node --check /tmp/app-inline.js
          git config user.name "CODE deploy bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html index.html
          git rm .github/workflows/patch-daily-ui.yml
          git commit -m "Match Windguru intervals and add intensity heat colors"
          git push
